[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisense-sdk"
version = "1.2.5"
description = "OmniSense Python SDK for user-configured independent task engines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OmniSense Contributors" }]
dependencies = ["Pillow==13.0.0", "PyYAML==6.0.3"]

[project.scripts]
omnisense = "omnisense.cli:main"

[tool.setuptools]
packages = ["omnisense"]

[tool.setuptools.package-data]
omnisense = ["bundled_algorithms/*/manifest.yaml"]
